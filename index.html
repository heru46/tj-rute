<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kōro">
  <meta name="description" content="Panduan naik Transjakarta dari titik A ke B: rute, tempat pindah, waktu, dan tarif.">
  <title>Kōro</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.ico" sizes="48x48">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Halaman pembuka: tampil saat app dibuka, hilang setelah data siap (atau diketuk). -->
  <div id="splash" class="splash">
    <picture>
      <source srcset="icons/koro-stacked-reversed.svg" media="(prefers-color-scheme: dark)">
      <img src="icons/koro-stacked.svg" alt="Kōro" width="382" height="344">
    </picture>
    <p class="credit">herujoko@2026</p>
  </div>

  <div id="map" aria-label="Peta"></div>

  <div class="map-brand">
    <picture>
      <source srcset="icons/koro-wordmark-reversed.svg" media="(prefers-color-scheme: dark)">
      <img src="icons/koro-wordmark.svg" alt="Kōro" width="358" height="163">
    </picture>
  </div>
  <p class="map-credit">herujoko@2026</p>

  <div id="status" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="pickbar" class="toast toast-action" hidden>
    <span>Ketuk peta untuk titik <b id="pick-label">A</b></span>
    <button type="button" id="pick-cancel" class="text-btn">Batal</button>
  </div>

  <section id="sheet" class="sheet" aria-label="Perencana perjalanan">
    <div id="sheet-head" class="sheet-head">
      <button type="button" id="grabber" class="grabber-zone" aria-label="Perbesar panel" aria-expanded="false">
        <span class="poni" aria-hidden="true"><span data-icon="chevronUp"></span></span>
        <span class="grabber" aria-hidden="true"></span>
      </button>

      <div class="route-form">
        <div class="ab">
          <label class="ab-row">
            <span class="ab-mark ab-a" aria-hidden="true"></span>
            <span class="ab-label">Dari</span>
            <input id="from" type="text" placeholder="Lokasi atau halte" autocomplete="off" enterkeyhint="search" aria-label="Titik berangkat">
            <button type="button" class="clear" data-clear="from" aria-label="Hapus titik berangkat" hidden></button>
          </label>
          <label class="ab-row">
            <span class="ab-mark ab-b" aria-hidden="true"></span>
            <span class="ab-label">Ke</span>
            <input id="to" type="text" placeholder="Tujuan" autocomplete="off" enterkeyhint="search" aria-label="Tujuan">
            <button type="button" class="clear" data-clear="to" aria-label="Hapus tujuan" hidden></button>
          </label>
        </div>
        <button type="button" id="swap" class="swap" aria-label="Tukar titik berangkat dan tujuan"></button>
      </div>

      <div class="chips">
        <button type="button" id="locate" class="chip-btn"><span data-icon="location"></span>Lokasi saya</button>
        <span class="chip-btn when-chip">
          <span data-icon="clock"></span><span id="when-label">Berangkat sekarang</span>
          <input id="when" type="datetime-local" aria-label="Waktu berangkat">
        </span>
        <button type="button" id="when-now" class="chip-btn chip-reset" aria-label="Kembali ke berangkat sekarang" hidden></button>
      </div>
    </div>

    <div id="content" class="sheet-body"></div>
  </section>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
